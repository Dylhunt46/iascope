<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="IAscope - Contactez l'équipe pour toute question, suggestion ou partenariat autour de l'Intelligence Artificielle.">
    <title>Contact | IAscope</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">IA<span>scope</span></div>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="outils.html">Outils I.A.</a></li>
                <li><a href="actualites.html">Actualités</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section class="page-header">
            <h1>Contactez-nous</h1>
            <p>Une suggestion d'outil, un partenariat ou une question sur IAscope ? Envoyez-nous un message.</p>
        </section>

        <!-- Section Formulaire -->
        <section class="contact-section">
            <form id="contact-form" action="mailto:dylthehunt@gmail.com" method="POST" enctype="text/plain">

                <!-- Champ Nom -->
                <div class="form-group">
                    <label for="name">Nom complet <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="Nom" required autocomplete="name" aria-required="true">
                </div>

                <!-- Champ Email -->
                <div class="form-group">
                    <label for="email">Adresse e-mail <span class="required" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="Email" required autocomplete="email" aria-required="true">
                </div>

                <!-- Champ Sujet -->
                <div class="form-group">
                    <label for="subject">Sujet <span class="required" aria-hidden="true">*</span></label>
                    <select id="subject" name="Sujet" required aria-required="true">
                        <option value="">-- Choisissez un sujet --</option>
                        <option value="Proposer un outil I.A.">Proposer un outil I.A.</option>
                        <option value="Partenariat / Presse">Partenariat / Presse</option>
                        <option value="Question générale">Question générale</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <!-- Champ Message -->
                <div class="form-group">
                    <label for="message">Message <span class="required" aria-hidden="true">*</span></label>
                    <textarea id="message" name="Message" rows="6" required aria-required="true"></textarea>
                </div>

                <!-- Case RGPD -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="rgpd" name="Consentement_RGPD" required aria-required="true">
                    <label for="rgpd">
                        J'accepte que mes informations soient utilisées pour traiter ma demande.
                        <span class="required" aria-hidden="true">*</span>
                    </label>
                </div>

                <!-- Bouton d'envoi -->
                <button type="submit" class="btn-primary">
                    Ouvrir mon logiciel de messagerie
                </button>

            </form>
        </section>
    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 IAscope. Tous droits réservés.</p>
    </footer>
</body>

</html>
